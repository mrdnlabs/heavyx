# Loaner AXIS Q6358-LE via Axis Virtual Loan Tool (ends 2026-08-14 21:00).
# Password comes from env PTZ_PASSWORD — do not write it into this file.
# Loan device blocks outgoing traffic, so detection runs locally on the RTSP
# stream (source: rtsp) instead of on-camera MQTT.

source: snapshot
mode: step

camera:
  host: 195.60.68.14
  http_port: 12101         # Q6355-LE loaner
  user: VLTuser
  camera_number: 1

snapshot_source:
  url: "http://195.60.68.14:12101/axis-cgi/jpg/image.cgi?resolution=1280x720"
  yolo_repo: ~/machinery/yolov5
  weights: /mnt/c/20260812_ConstructionYoloModel/models/stage0/yolov5n_artpec9_coco_640.pt
  conf: 0.30
  interval_s: 0.4

targeting:
  # COCO classes for the loaner experiment (fire extinguisher reads as bottle);
  # swap for machinery classes in production
  classes: [bottle, oven, person, chair, tv, laptop, potted plant]
  min_confidence: 0.30
  max_age_s: 3.0
  stickiness_s: 6.0

step:
  period_s: 1.0            # one command per second
  approach_fraction: 0.33  # gentler steps => no jitter-driven overshoot
  deadband: 0.07           # ~50px quiet zone: stop correcting when close
  ema_alpha: 0.35          # heavier smoothing of the (jittery) box center

velocity:
  rate_hz: 6
  pan_gain: 60
  tilt_gain: 45
  pan_dgain: 8
  tilt_dgain: 6
  deadband: 0.055
  max_speed: 60
  ema_alpha: 0.4
  speed_by_zoom: true

zoom:
  enabled: true
  target_height_frac: 0.5  # object ~half the frame height
  band: [0.35, 0.65]       # hysteresis: no zoom action inside this band
  min_step: 0.7
  max_step: 1.6
  reacquire_step: 2000

loss:
  stop_after_s: 1.5
  zoom_out_after_s: 6.0
